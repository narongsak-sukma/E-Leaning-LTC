# ============================================================================
# LTC E-Learning — dev stack (100% local Docker) — ตาม ARCHITECTURE.md §4
# โค้ดชุดเดียวกับ prod ต่างกันเฉพาะ env vars (brief §6) — prod: Vercel+Supabase Cloud+Cloudflare
#
#   make dev   = up + follow logs   |   make down   |   make ps   |   make psql
#   make up-prod / down-prod = production-build runtime (profile "prod", :3001 — เฟส 3 D90)
#
# services: app (Next.js dev) · app-prod (Next.js production, profile "prod") · db · auth ·
#           rest · storage · imgproxy · kong · mailpit · db-migrate
# ============================================================================
name: ltc-elearning-dev

services:

  # ---------------------------------------------------------------- PostgreSQL
  # image ทางการ supabase/postgres: roles (anon/authenticated/service_role),
  # schemas auth/storage และ extensions ที่ RLS ต้องใช้ถูก bake มาแล้ว
  db:
    image: supabase/postgres:15.8.1.060
    container_name: ltc-dev-db
    restart: unless-stopped
    # log_parameter_max_length_on_error=-1: พิมพ์ bind parameters เต็มใน error log
    # ของ db — fence v6→v7 (gate waveh-r8/r9 M1) ใช้ parameters line ($1 JSON มี
    # p_request_id) เป็นหมุดผูก invocation ของ error block (จับคู่ใน record เดียว
    # ตาม PID ของ backend — tests/integration/db-error-blocks.ts) — ค่าเดียวกันถูก
    # ตั้งใน volume ปัจจุบันด้วย ALTER SYSTEM แล้ว รายการ command นี้ทำให้ fresh
    # checkout ได้ค่าเดียวกัน
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_parameter_max_length_on_error=-1
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env (cp .env.example .env)}
    ports:
      # มุมมอง host — ปรับได้ผ่าน POSTGRES_HOST_PORT (เครื่องที่มี Postgres อื่นครอง 5432 ให้ตั้ง 54322)
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Auth (GoTrue)
  auth:
    image: supabase/gotrue:v2.164.0
    container_name: ltc-dev-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set in .env}
      GOTRUE_JWT_EXP: "3600"
      # PB-6: role claim เริ่มต้นของ JWT ต้องตรง role จริงในฐานข้อมูล (authenticated)
      # — ค่า supabase ทำให้ PostgREST ปฏิเสธทุก query ของ user จนกระทั่ง helper ต้อง
      # มา patch auth.users.role ทีหลัง (แฮ็กชั่วคราวของ C-9 ที่เลิกใช้แล้ว)
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      # dev-stack: integration tests สร้างผู้ใช้จริงผ่าน signup หลายสิบรายต่อรอบ —
      # ค่า default ของ GoTrue (อีเมล 30 ฉบับ/ชม.) ทำให้ /signup โดน 429 email rate
      # limit กลางวงจร (Mailpit รับอีเมลทิ้งอยู่แล้ว จึงตั้งสูงได้โดยไม่กระทบผู้ใช้จริง)
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: dev-admin@ltc.local
      GOTRUE_SMTP_SENDER_NAME: LTC E-Learning (dev)
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_LOGGING_LEVEL: debug
      # gate p3-r1 B3 (สืบเนื่อง): MFA ของ GoTrue v2.164.0 อยู่ที่ /auth/v1/factors*
      # (POST /factors · POST /factors/{id}/challenge · POST /factors/{id}/verify ·
      # DELETE /factors/{id}) — เวอร์ชันนี้ไม่มี /mfa/* เลย (probe จริง: /mfa/enroll
      # = 404 จากตัว GoTrue · /factors = 401 รอ Bearer) · TOTP enroll/verify เปิด
      # default true (internal/conf TOTPFactorTypeConfiguration) ไม่ต้องตั้ง env
      # ใด — aal2 พิสูจน์จริงได้บน dev stack: enroll → challenge → verify สำเร็จ
      # = response เป็น session ใหม่ access_token aal=aal2
    networks: [ltc-dev]

  # ----------------------------------------------------------------- PostgREST
  # แปลง schema public เป็น REST — ตรวจ JWT ด้วย secret เดียวกับ auth
  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: ltc-dev-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_API_MAX_ROWS: "1000"
      # gate p1-r1 MAJOR-1: PostgREST 12 ปิด aggregate โดยดีฟอลต์ — monitoring/statistics
      # ใช้ id.count()/score_pct.avg() ผ่าน user-JWT client จึงต้องเปิดไว้ (พิสูจน์ด้วย
      # curl /rest/v1/courses?select=id.count() ก่อน-หลัง: 400 PGRST123 → 200)
      PGRST_DB_AGGREGATES_ENABLED: "true"
      # Wave H D89-3 [#94]: access-log fence ของ evidence-settle — settle kong-path 500
      # ได้ต่อเมื่อ window มี line {ua_nonce+method+path-normalized+" 500 "} หนึ่งต่อหนึ่ง
      # default = silent (probe จริง: 200/404/401/42501/500 P0002 ไม่มี line ทุกสถานะที่ทดลอง)
      # info = Apache line ทุกสถานะ เขียนเมื่อ request จบ · dev-only (ไม่ buffer — มีผล
      # throughput) · production (Cloudflare+Supabase) ไม่มีกลไกนี้
      PGRST_LOG_LEVEL: info
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Storage API
  # dev backend = ไฟล์บน volume (MEDIA_PROVIDER=supabase_storage ชี้มาที่นี่ผ่าน kong)
  storage:
    image: supabase/storage-api:v1.0.6
    container_name: ltc-dev-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?set in .env}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set in .env}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      PGOPTIONS: -c search_path=storage,public
      # storage-api v1.x ฝัง PostgREST ไว้ข้างใน — ต้องมี secret ชุดเดียวกับ service rest
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      FILE_SIZE_LIMIT: "2097152000"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      IMGPROXY_URL: http://imgproxy:8088
      IMGPROXY_REQUEST_TIMEOUT: "15"
      API_EXTERNAL_URL: http://localhost:8000
      REQUEST_ID_HEADER: x-request-id
    volumes:
      - storage_data:/var/lib/storage
    networks: [ltc-dev]

  # ----------------------------------------------------------------- imgproxy
  # ตัด/ย่อรูปให้ Storage API (ทางการของ supabase) — ถ้าละได้แต่ transform รูปจะล้มเหลว
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: ltc-dev-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_ALLOW_ORIGIN: "*"
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Kong gateway
  # ประตูเดียวของ Supabase local (:8000) — SUPABASE_URL ชี้ที่นี่
  kong:
    image: kong:2.8.1
    container_name: ltc-dev-kong
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 16k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 8 24k
      KONG_LOG_LEVEL: notice
    ports:
      - "8000:8000"
    volumes:
      - ./docker/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    healthcheck:
      # image kong 2.8 ไม่มี curl — ใช้คำสั่ง health ของ kong เอง (ตรวจ nginx ภายใน)
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Mailpit
  # จับอีเมล dev (SMTP :1025) + UI ดูอีเมล (:8025) — gotrue ส่งเมล recovery/invite มาที่นี่
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: ltc-dev-mailpit
    restart: unless-stopped
    environment:
      MP_DATA_FILE: /data/mailpit.db
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Next.js dev
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: ltc-dev-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # ---- override ปลายทางให้มองผ่าน compose network (มุมมอง host อยู่ใน .env) ----
      SUPABASE_URL: http://kong:8000
      SMTP_HOST: mailpit
      SUPABASE_DB_POOLER_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # D-f-7: เพิ่ม heap ให้ next dev (container) — ลด memory-threshold restart ช่วง full e2e
      # (Next dev ตรวจ used_heap > 0.8×heap_limit หลังทุก request แล้ว restart router-server
      #  ทันที — full suite 34 เทสสะสม module graph ~2.5GB+ · 3072 ยังโดน 1 ครั้งช่วง e2e-14
      #  เห็นใน e2e-full-r3 — เพิ่มเป็น 4096 + playwright retries:1 กันขอบ)
      # Wave H D90 [#94]: 4096 → 6144 — e2e สะสมหลัง suite โตข้ามเพดาน 0.8×4096 อีก
      # พิสูจน์ด้วย scripts/heap-sampler.sh → .omc/artifacts/heap-samples.jsonl (dev-only)
      # Wave H D90 rollback [#94]: 6144 → 4096 ตามเกณฑ์ "restart กลาง battery = ถอย" —
      # battery r1 (feat/wave-h-hardening @ 1f93cdb) ช่วง e2e 01:19/01:22Z เกิด kernel-OOM
      # ของ Docker VM 7.748GiB 2 ครั้ง (docker telemetry oom-kills 01:19:12.94Z/01:22:40.25Z
      # ตรง boot banner 01:19:14/01:22:41 · RestartCount 0→2 กลางรอบตาม sampler) ฆ่า container
      # ทั้งลูก → e2e-10 ตายทั้ง 2 attempts (isolated rerun 1/1 ผ่าน 32.8s = ไม่ใช่ regression)
      # ที่ 6144 เพดาน self-restart 4915MB สูงเกิน headroom ของ VM ที่แชร์กับ kong~1GiB+
      # container อื่น ~2.6GiB — ถอยกลับ 4096 (self-restart 3277MB รีไซเคิล child ก่อน VM
      # หมด = ระบอบที่ battery เขียวมาก่อน wave-G r11) + เปิด DCR production-build e2e
      NODE_OPTIONS: --max-old-space-size=4096
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || wget -qO- http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ltc-dev]

  # --------------------------------------------------------------- Next.js prod
  # Wave I เฟส 3 [#94] (DCR-PROD-BUILD-E2E.md · verdict wavei-r3): production runtime
  # เป็นพาหะวัด D90 — next dev มี memory-threshold self-restart (0.8×NODE_OPTIONS)
  # ที่ฉีก module registry กลาง request ทำให้ battery e2e ล้มสุ่มตำแหน่ง (r36/r37)
  # · `next start` ปฏิเสธการรันเมื่อไม่มี production build → service ที่ตอบ
  # health 200 ได้ = กำลังเสิร์ฟ production build จริง (ชั้นที่ 0 ของ prod-proof)
  # · profile "prod": ไม่ขึ้นกับ make up ปกติ — เรียกผ่าน make up-prod/down-prod
  #   เท่านั้น (docker compose down ไม่สน profile และทำลาย container นี้ด้วย
  #   → make down/reset-db dump ทั้งสอง container ก่อนเสมอ — E2)
  # · NEXT_PUBLIC_* ฝังตอน build ใน container ด้วย env_file เดียวกับ dev → ตรงค่า
  # · next_cache_prod แยกจาก next_cache ของ dev เด็ดขาด (รูปแบบ build ต่างกัน)
  # · ไม่ใส่ CHOKIDAR/WATCHPACK (prod ไม่ watch) และไม่กำหนด NODE_OPTIONS
  #   (ไม่มี dev memory-check · heap ใช้ default ของ Node)
  app-prod:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: ltc-prod-app
    profiles: ["prod"]
    restart: unless-stopped
    command: ["sh", "-c", "npm run build && npm start"]
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # ---- override ปลายทางให้มองผ่าน compose network (มุมมอง host อยู่ใน .env) ----
      SUPABASE_URL: http://kong:8000
      SMTP_HOST: mailpit
      SUPABASE_DB_POOLER_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      NODE_ENV: production
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache_prod:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || wget -qO- http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      # build ใน container ตอน boot กินเวลา — ให้เวลามากกว่า dev
      start_period: 600s
    networks: [ltc-dev]

  # ----------------------------------------------------------------- mailer
  # ทริกเกอร์ background worker ทั้งสองตัวของ dev (prod = Vercel Cron):
  #   1) email dispatch (D-p4-8)   → POST /api/internal/jobs/email-dispatch
  #   2) pdpa export (D-p5-7 #90)  → POST /api/internal/jobs/pdpa-export
  # loop ทุก 30 วินาที พร้อม header x-cron-secret · endpoint ที่ยังไม่มีไฟล์จริง
  # ตอบ 404 เงียบ (fail-closed ของ route เอง) — log รหัสแล้วข้ามไปทำงานต่อ
  # CRON_SECRET อ่านจาก .env อัตโนมัติ (compose interpolation) — ค่าว่าง = ยังไม่ตั้ง
  # config → sleep ยาว + log ว่ารอ (fail-closed ไม่ยิง endpoint)
  mailer:
    image: curlimages/curl:8.11.1
    container_name: ltc-dev-mailer
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # $$ = escape ของ compose — shell ใน container อ่านจาก environment ตอน runtime
      CRON_SECRET: ${CRON_SECRET:-}
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        while true; do
          if [ -z "$$CRON_SECRET" ]; then
            echo "$$(date +%FT%T%z) mailer: CRON_SECRET ยังไม่ตั้ง — รอ config (ไม่ยิง endpoint)"
            sleep 300
          else
            code=$$(curl -s -m 25 -o /tmp/resp.txt -w "%{http_code}" -X POST -H "x-cron-secret: $$CRON_SECRET" http://app:3000/api/internal/jobs/email-dispatch) || code=curl_failed
            echo "$$(date +%FT%T%z) mailer: HTTP=$$code body=$$(head -c 200 /tmp/resp.txt 2>/dev/null)"
            code=$$(curl -s -m 25 -o /tmp/resp.txt -w "%{http_code}" -X POST -H "x-cron-secret: $$CRON_SECRET" http://app:3000/api/internal/jobs/pdpa-export) || code=curl_failed
            echo "$$(date +%FT%T%z) mailer-pdpa: HTTP=$$code body=$$(head -c 200 /tmp/resp.txt 2>/dev/null)"
            sleep 30
          fi
        done
    networks: [ltc-dev]

  # ----------------------------------------------------------------- migrations
  # one-shot: apply supabase/migrations/*.sql ทุกครั้งที่ up (idempotent) — ดู docker/db/migrate.sh
  db-migrate:
    image: supabase/postgres:15.8.1.060
    container_name: ltc-dev-db-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    entrypoint: ["/bin/sh", "/migrate.sh"]
    volumes:
      - ./docker/db/migrate.sh:/migrate.sh:ro
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
    networks: [ltc-dev]

networks:
  ltc-dev:
    driver: bridge

volumes:
  db_data:
  storage_data:
  mailpit_data:
  node_modules:
  next_cache:
  # Wave I เฟส 3 [#94]: production build ของ app-prod — ห้ามแชร์กับ next_cache ของ dev
  next_cache_prod:

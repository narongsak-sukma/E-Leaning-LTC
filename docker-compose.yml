# ============================================================================
# LTC E-Learning — dev stack (100% local Docker) — ตาม ARCHITECTURE.md §4
# โค้ดชุดเดียวกับ prod ต่างกันเฉพาะ env vars (brief §6) — prod: Vercel+Supabase Cloud+Cloudflare
#
#   make dev   = up + follow logs   |   make down   |   make ps   |   make psql
#
# services: app (Next.js dev) · db · auth · rest · storage · imgproxy · kong · mailpit · db-migrate
# ============================================================================
name: ltc-elearning-dev

services:

  # ---------------------------------------------------------------- PostgreSQL
  # image ทางการ supabase/postgres: roles (anon/authenticated/service_role),
  # schemas auth/storage และ extensions ที่ RLS ต้องใช้ถูก bake มาแล้ว
  db:
    image: supabase/postgres:15.8.1.060
    container_name: ltc-dev-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env (cp .env.example .env)}
    ports:
      # มุมมอง host — ปรับได้ผ่าน POSTGRES_HOST_PORT (เครื่องที่มี Postgres อื่นครอง 5432 ให้ตั้ง 54322)
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Auth (GoTrue)
  auth:
    image: supabase/gotrue:v2.164.0
    container_name: ltc-dev-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set in .env}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: supabase
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: dev-admin@ltc.local
      GOTRUE_SMTP_SENDER_NAME: LTC E-Learning (dev)
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_LOGGING_LEVEL: debug
    networks: [ltc-dev]

  # ----------------------------------------------------------------- PostgREST
  # แปลง schema public เป็น REST — ตรวจ JWT ด้วย secret เดียวกับ auth
  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: ltc-dev-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_API_MAX_ROWS: "1000"
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Storage API
  # dev backend = ไฟล์บน volume (MEDIA_PROVIDER=supabase_storage ชี้มาที่นี่ผ่าน kong)
  storage:
    image: supabase/storage-api:v1.0.6
    container_name: ltc-dev-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?set in .env}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set in .env}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      PGOPTIONS: -c search_path=storage,public
      # storage-api v1.x ฝัง PostgREST ไว้ข้างใน — ต้องมี secret ชุดเดียวกับ service rest
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      FILE_SIZE_LIMIT: "2097152000"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      IMGPROXY_URL: http://imgproxy:8088
      IMGPROXY_REQUEST_TIMEOUT: "15"
      API_EXTERNAL_URL: http://localhost:8000
      REQUEST_ID_HEADER: x-request-id
    volumes:
      - storage_data:/var/lib/storage
    networks: [ltc-dev]

  # ----------------------------------------------------------------- imgproxy
  # ตัด/ย่อรูปให้ Storage API (ทางการของ supabase) — ถ้าละได้แต่ transform รูปจะล้มเหลว
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    container_name: ltc-dev-imgproxy
    restart: unless-stopped
    environment:
      IMGPROXY_ALLOW_ORIGIN: "*"
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Kong gateway
  # ประตูเดียวของ Supabase local (:8000) — SUPABASE_URL ชี้ที่นี่
  kong:
    image: kong:2.8.1
    container_name: ltc-dev-kong
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 16k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 8 24k
      KONG_LOG_LEVEL: notice
    ports:
      - "8000:8000"
    volumes:
      - ./docker/kong/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    healthcheck:
      # image kong 2.8 ไม่มี curl — ใช้คำสั่ง health ของ kong เอง (ตรวจ nginx ภายใน)
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Mailpit
  # จับอีเมล dev (SMTP :1025) + UI ดูอีเมล (:8025) — gotrue ส่งเมล recovery/invite มาที่นี่
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: ltc-dev-mailpit
    restart: unless-stopped
    environment:
      MP_DATA_FILE: /data/mailpit.db
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8025/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [ltc-dev]

  # ----------------------------------------------------------------- Next.js dev
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: ltc-dev-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kong:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # ---- override ปลายทางให้มองผ่าน compose network (มุมมอง host อยู่ใน .env) ----
      SUPABASE_URL: http://kong:8000
      SMTP_HOST: mailpit
      SUPABASE_DB_POOLER_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || wget -qO- http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [ltc-dev]

  # ----------------------------------------------------------------- migrations
  # one-shot: apply supabase/migrations/*.sql ทุกครั้งที่ up (idempotent) — ดู docker/db/migrate.sh
  db-migrate:
    image: supabase/postgres:15.8.1.060
    container_name: ltc-dev-db-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    entrypoint: ["/bin/sh", "/migrate.sh"]
    volumes:
      - ./docker/db/migrate.sh:/migrate.sh:ro
      - ./supabase/migrations:/migrations:ro
    networks: [ltc-dev]

networks:
  ltc-dev:
    driver: bridge

volumes:
  db_data:
  storage_data:
  mailpit_data:
  node_modules:
  next_cache:

# Kong gateway (DB-less, declarative) — ประตูเดียวเข้า Supabase local
# แนวเดียวกับ supabase/docker (self-hosting ทางการ) — route /auth/v1, /rest/v1, /storage/v1
# key ของ consumer ต้องตรงกับ SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY ใน .env
# (sign ด้วย SUPABASE_JWT_SECRET เดียวกัน — เปลี่ยน secret ต้อง regenerate แล้วแก้ที่นี่ด้วย)
_format_version: "1.1"
_transform: true

services:
  # ---- Auth: ลิงก์ verify ในอีเมล (browser คลิกโดยไม่มี header apikey) ----
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open-route
        paths:
          - /auth/v1/verify
        strip_path: true
    plugins:
      - name: cors

  # ---- Auth: เส้นทางทั่วไป (ต้องแนบ apikey เหมือนเรียกผ่าน supabase-js) ----
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-route
        paths:
          - /auth/v1
        strip_path: true
    plugins:
      - name: cors
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true

  # ---- PostgREST: /rest/v1 (apikey บังคับ) ----
  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-route
        paths:
          - /rest/v1
        strip_path: true
    plugins:
      - name: cors
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true

  # ---- Storage: เส้นทางทั่วไป (apikey บังคับ — รวม POST /object/sign การลงนาม) ----
  # gate p5-r1 (DCR-12 เคส g): storage-v1-open เดิม (paths /object/sign|authenticated/
  # public + strip_path:true) ตัด "ทั้งเซกเมนต์ที่ match" ทิ้ง — storage:5000 ซึ่ง mount
  # ที่ root (/object/...) ได้รับ /{bucket}/{key} ล้วน → 404 (createSignedUrl พังทุกบักเก็ต
  # · พิสูจน์ด้วย probe: POST /object/sign/... ตรง = 400 ต้องการ authorization แต่ route
  # มีจริง) · แอปทุก flow เป็น server-side service client (แนบ apikey เสมอ) — เส้นทาง
  # เดียวนี้ถูกต้องอยู่แล้ว (strip เฉพาะ /storage/v1) · browser public/authenticated
  # ยังไม่มีการใช้ใน src — เมื่อต้องการ ให้สร้าง service แยกโดยฝัง prefix ใน service
  # url เอง (http://storage:5000/object/public) เพราะ Kong strip เฉพาะทั้ง match เท่านั้น
  - name: storage-v1
    url: http://storage:5000
    routes:
      - name: storage-v1-route
        paths:
          - /storage/v1
        strip_path: true
    plugins:
      - name: cors
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true

  # ---- Storage: ดาวน์โหลดไฟล์ด้วย signed URL (browser คลิกลิงก์จากอีเมล — ไม่มี apikey) ----
  # gate p5-r2 BLOCKER-2: ลิงก์ data_export.ready มีเพียง ?token=… ผู้รับไม่ได้แนบ
  # apikey — route ทั่วไป (key-auth) จะ 401 ก่อนถึง storage · route นี้เปิดเฉพาะ
  # GET /storage/v1/object/sign/{bucket}/{key} โดยฝัง prefix ใน service url
  # (http://storage:5000/object/sign) เพราะ strip_path ตัดได้เฉพาะ "ทั้ง match" —
  # storage รับ /{bucket}/{key}?token=… ตรง mount และตรวจ token เอง (invalid/หมดอายุ
  # = 400 จาก storage ไม่ใช่ 401 จาก Kong) · การ "สร้าง" signature (POST sign) ไม่ผ่าน
  # route นี้ (methods GET เท่านั้น + storage เองบังคับ authorization อยู่แล้ว) ·
  # Kong เลือก route ที่ path ยาวกว่าก่อน → GET ที่ชนคำนวณ /storage/v1 ตก route นี้
  - name: storage-v1-signed
    url: http://storage:5000/object/sign
    routes:
      - name: storage-v1-signed-route
        paths:
          - /storage/v1/object/sign
        strip_path: true
        methods:
          - GET
    plugins:
      - name: cors

